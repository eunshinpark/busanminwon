<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부산 AI 민원 길잡이</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#fff;--card:#fff;--ink:#000;--sub:#737373;--line:#e5e5e5;--soft:#f5f5f5;--pri:#000;--priink:#fff;--ok:#16a34a;--warn:#92400e;--warnbg:#fffbeb}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#0a0a0a;--ink:#fafafa;--sub:#a3a3a3;--line:#262626;--soft:#171717;--pri:#fafafa;--priink:#0a0a0a;--ok:#4ade80;--warn:#fbbf24;--warnbg:#1c1708}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 ui-sans-serif,system-ui,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:720px;margin:0 auto;padding:72px 16px 8px;text-align:center}
.view[hidden]{display:none}.view>main{padding-top:40px}.view>header+main{padding-top:24px}
/* 좌측 메뉴: 넓은 화면에서는 본문 왼쪽에 떠 있는 유리질 카드, 좁은 화면에서는 상단 탭 */
.side{position:fixed;top:140px;left:max(16px,calc(50vw - 360px - 196px));z-index:20;width:172px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid rgba(0,0,0,.08);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
.side-title{font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--sub);padding:2px 10px 8px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:999px;color:#525252;font-size:13px;font-weight:500;text-decoration:none;transition:background .15s ease,color .15s ease}
nav a:hover{background:rgba(0,0,0,.05);color:var(--ink)}
nav a[aria-current=page]{background:#52606d;color:#fff}
nav svg{width:16px;height:16px;flex:0 0 20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-color-scheme:dark){.side{background:rgba(23,23,23,.72);border-color:rgba(255,255,255,.1)}nav a{color:#a3a3a3}nav a:hover{background:rgba(255,255,255,.08)}}
@media(max-width:1179px){
  .side{position:sticky;top:0;left:auto;width:auto;flex-direction:row;justify-content:center;padding:0 12px;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
  .side-title{display:none}nav{flex-direction:row;gap:4px}
  nav a{border-radius:0;padding:13px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14px;font-weight:600;color:var(--sub)}
  nav a:hover{background:none;color:var(--ink)}
  nav a[aria-current=page]{background:none;color:var(--ink);border-bottom-color:var(--ink)}}
.foot{max-width:720px;margin:0 auto;padding:0 16px 40px}
.inl{margin:2px 0 12px}.inl .box{margin:0 0 4px;background:var(--soft)}.inl .box dl{margin-bottom:4px}.cand{scroll-margin-top:72px}.cand[aria-expanded=true]{opacity:1}.cand[aria-expanded=true] .r::after{content:' ▴'}.cand[aria-expanded=false] .r::after{content:' ▾'}
.link2{border:0;background:none;padding:4px 2px;margin-bottom:10px;color:var(--sub);font-size:14px}.link2:hover{background:none;color:var(--ink)}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.hrow:first-child{border-top:0}
.hrow .q{flex:1;min-width:0;text-align:left;border:0;background:none;padding:2px 4px;border-radius:8px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .q:hover{background:var(--soft)}.hrow small{color:var(--sub);white-space:nowrap}
.hrow .x{border:0;background:none;color:var(--sub);padding:2px 9px;font-size:18px;line-height:1}.hrow .x:hover{color:var(--ink);background:var(--soft)}
#histclr[hidden]{display:none}
header h1{margin:0;font-size:clamp(34px,6vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.2;
  --g1:#9ca3af;--g2:#4b5563;--g3:#000;--g4:#4b5563;
  background:linear-gradient(100deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g1)) 0 0/300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
@media(prefers-color-scheme:dark){header h1{--g1:#737373;--g2:#d4d4d4;--g3:#fff;--g4:#d4d4d4}}
header p{margin:12px 0 0;color:var(--sub);font-size:18px;word-break:keep-all}
.logo{display:block;width:100%;max-width:600px;height:auto;margin:0 auto}
.visual{display:grid;width:100%;max-width:520px;margin:28px auto 0;border-radius:16px;overflow:hidden;background:#fff}
.visual img{grid-area:1/1;display:block;width:100%;height:auto}
.visual .v2{opacity:0;animation:swapA 10s 1s ease-in-out infinite}
@keyframes swapA{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.hero{padding:0;border:0}
textarea{width:100%;min-height:104px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);font:inherit;resize:vertical;outline:0}
textarea:focus{border-color:var(--sub);background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.hero .row{justify-content:center}
button{font:inherit;font-size:14px;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 16px;transition:background .15s}
button:hover{background:var(--soft)}
button:focus-visible,a:focus-visible,.cand:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.pri.send{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:9px 16px;font-size:14px}
button.pri.send svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ask{position:relative}.ask textarea{display:block;min-height:66px;max-height:260px;padding:19px 132px 19px 18px;line-height:1.65;resize:none;overflow:hidden}
.ask .send{position:absolute;right:11px;bottom:11px}
.hint{margin:6px 8px 0;text-align:right;font-size:12px;color:var(--sub)}
.ex{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;align-items:center;margin-top:16px}
.ex .lb{font-size:13px;color:var(--sub)}.exs{display:contents}
.ex .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--priink);font-weight:500;padding:10px 26px;font-size:15px}button.pri:hover{opacity:.85;background:var(--pri)}
.chip{color:var(--sub);background:var(--soft);border:0}
.chip:hover{background:var(--line)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:10px 0 6px}h3{font-size:14px;margin:18px 0 6px;color:var(--sub);font-weight:500}
dl{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;margin:14px 0;padding-top:12px;border-top:1px solid var(--line)}dt{color:var(--sub)}dd{margin:0;word-break:keep-all}
a{color:var(--ink);text-underline-offset:3px}.file{display:block;margin:3px 0}
.fb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-4px 0 16px;color:var(--sub);font-size:14px}.fb button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}.fb button:hover{background:var(--soft)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px}
pre{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:14px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,"Noto Sans KR",monospace;margin:6px 0 10px}
.cand{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.cand:hover{opacity:.7}.cand small{color:var(--sub)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;width:80px}.bar i{display:block;height:100%;background:var(--ink)}
.tags span{margin-right:6px}.muted{color:var(--sub);font-size:13px}
input[type=search]{width:100%;padding:11px 18px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--ink);font:inherit;font-size:15px;outline:0}
input[type=search]:focus{border-color:var(--sub);background:var(--bg)}
button.link{border:0;background:none;color:var(--sub);padding:2px 6px;margin-left:auto;font-size:13px;text-decoration:underline;text-underline-offset:3px}
button.link:hover{background:none;color:var(--ink)}
.hist .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist[hidden]{display:none}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.fl .lb{font-size:12px;color:var(--sub);margin-right:2px}
.tg{font-size:13px;padding:5px 12px;color:var(--ink);background:var(--soft);border:1px solid transparent}
.tg small{color:var(--sub);margin-left:4px}
.tg:hover{background:var(--line)}
.tg.on{background:var(--pri);border-color:var(--pri);color:var(--priink)}.tg.on small{color:inherit;opacity:.7}
.tg:disabled{opacity:.35;cursor:default}
.mini{display:inline-block;font-size:11px;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--sub);margin-left:6px;vertical-align:1px}
#more[hidden],#hot[hidden],#allh[hidden]{display:none}
#list .cand:first-child{border-top:0}#hotl .cand:first-child{border-top:0}
.cand .r{text-align:right;white-space:nowrap;color:var(--sub);font-size:13px}
header h1,header p,.visual,.hero{animation:rise .6s ease both}
header h1{animation:rise .6s ease both,flow 7s linear infinite}
header p{animation-delay:.1s}.visual{animation:rise .6s .2s ease both,bob 5s 1s ease-in-out infinite}.hero{animation-delay:.3s}
.visual:hover{animation-play-state:running,paused}
#out>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flow{to{background-position:300% 0}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.bar i{animation:grow .7s .2s ease both;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}}
.loading i{display:inline-block;width:5px;height:5px;margin-left:5px;border-radius:50%;background:var(--ink);animation:dot 1s infinite ease-in-out}
.loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){.visual .v2{display:none}*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:560px){dl{grid-template-columns:78px 1fr}header{padding-top:40px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="side-title">MENU</div>
  <nav id="nav" aria-label="메뉴">
    <a href="#chat" data-v="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>대화로 하기</a>
    <a href="#list" data-v="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>목록 찾기</a>
    <a href="#hist" data-v="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>검색 이력</a>
  </nav>
</aside>
<div class="content">
<section id="v-chat" class="view">
<header><h1>부산 AI 민원 길잡이</h1><p>민원을 입력하면 담당 부서, 처리기한, 서식까지 바로 알려드려요.</p>
  <div class="visual"><img class="v1" src="minwon_main.webp" width="1200" height="675" alt="민원인의 질문에 안경 쓴 오리 안내원이 서류와 처리 일정을 안내하는 일러스트" fetchpriority="high"><img class="v2" src="minwon_main2.webp" width="1200" height="675" alt="민원인이 해결됐다며 감사 인사를 하고 오리 안내원이 기뻐하는 일러스트" loading="lazy"></div>
</header>
<main>
  <div class="box hero">
    <div class="ask">
      <textarea id="q" rows="1" placeholder="예) 건설등록증을 분실했어요"></textarea>
      <button class="pri send" id="go">안내받기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="hint">Enter 검색 · Shift+Enter 줄바꿈</div>
    <div class="ex"><span class="lb">자주 찾는 민원</span><div class="exs" id="exs"></div></div>
  </div>
  <div id="out"></div>
</main>
</section>
<section id="v-list" class="view" hidden>
<main>
  <div class="box" id="lbrowse">
    <h2 style="margin-top:0">민원 목록에서 찾기</h2>
    <input id="kw" type="search" placeholder="민원명이나 부서로 검색 (예: 재발급, 건설)" autocomplete="off">
    <div class="fl" id="fcat" role="group" aria-label="분야"></div>
    <div class="fl" id="fsub" role="group" aria-label="빠른 필터"></div>
    <div class="muted" id="cnt" style="margin:12px 2px 0" aria-live="polite"></div>
    <div id="hot" hidden><h3>많이 본 민원</h3><div id="hotl"></div></div>
    <h3 id="allh" hidden>전체 목록</h3>
    <div id="list"></div>
    <div class="row" style="justify-content:center"><button id="more" hidden>더 보기</button></div>
  </div>
</main>
</section>
<section id="v-hist" class="view" hidden>
<main>
  <div class="box">
    <div class="row" style="margin:0"><h2 style="margin:0">검색 이력</h2><button class="link" id="histclr" hidden>전체 삭제</button></div>
    <p class="muted" style="margin:6px 0 10px">이 브라우저 기준으로 서버에 저장되며, 최근 50건까지 보관돼요. 항목을 누르면 다시 검색합니다.</p>
    <div id="hlist"></div>
  </div>
</main>
</section>
<p class="muted foot" id="src"></p>
</div>
</div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LAST=null,AI=false;
function detail(c,drafted){
  const files=(c.files||[]).map(f=>`<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener">⬇ ${esc(f.name)}</a>`).join('');
  return `<div class="box"><span class="badge">민원유형 · ${esc(c.typeName)}</span> <span class="muted">(${esc(c.typeWhy?'근거: “'+c.typeWhy+'”':'규칙 분류')})</span>
  <h2>${esc(c.name)}</h2>
  <dl>
   <dt>담당 부서</dt><dd>${esc(c.bureau?c.bureau+' › ':'')}<b>${esc(c.dept)}</b>${c.group!=='본청'?' <span class="muted">('+esc(c.group)+')</span>':''}</dd>
   <dt>전화번호</dt><dd>${c.phone?'☎ '+esc(c.phone):'<span class="muted">민원편람 미확인 · 120콜센터 문의</span>'}</dd>
   <dt>처리기한</dt><dd><b>${esc(c.period)}</b>${c.presurvey?`<div class="muted">사전심사 시 ${esc(c.presurvey.pre)} (법정 ${esc(c.presurvey.legal)}, 정식민원 제출 후 ${esc(c.presurvey.after)})</div>`:''}</dd>
   <dt>수수료</dt><dd>${esc(c.fee)}</dd>
   ${c.window?`<dt>접수 창구</dt><dd>통합민원과 ${esc(c.window.window)} · ☎ ${esc(c.window.phone)}${c.onestop?' <span class="badge">원스톱</span>':''}</dd>`:(c.onestop?'<dt>접수 창구</dt><dd>통합민원과 원스톱 민원</dd>':'')}
   <dt>서식</dt><dd>${files||'<span class="muted">첨부 서식 없음 또는 편람 미연결</span>'}${c.manualUrl?`<div class="muted"><a href="${esc(c.manualUrl)}" target="_blank" rel="noopener">민원편람 상세 보기 ↗</a></div>`:''}</dd>
   ${c.note?`<dt>비고</dt><dd>${esc(c.note)}</dd>`:''}
  </dl>${drafted||''}</div>`;
}
function render(r){
  LAST=r; let h='';
  if(!r.results||!r.results.length){$('#out').innerHTML='<div class="box warn">'+esc(r.notice||'결과가 없습니다.')+'</div>';return}
  if(r.notice) h+=`<div class="warn">${esc(r.notice)}</div>`;
  const dr=r.draft?`<h3>답변 초안</h3><pre id="dr">${esc(r.draft)}</pre><button onclick="navigator.clipboard.writeText($('#dr').textContent).then(()=>this.textContent='복사됨 ✓')">초안 복사</button>`:'';
  const sum=r.aiOn?`<div class="box" id="aisum"><b>민원 요약</b> <span class="badge">AI</span><p id="aitxt" class="muted" style="margin:8px 0 0">AI가 요약하는 중…</p></div>`:'';
  h+=sum+detail(r.results[0],dr)+`<div class="fb" id="fb"><span>이 안내가 도움이 되었나요?</span><button data-v="1"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3zm0 0 4-8a2 2 0 0 1 2 2v4h5.3a2 2 0 0 1 2 2.3l-1.2 6.5a2 2 0 0 1-2 1.7H7"/></svg> 도움됨</button><button data-v="0"><svg style="transform:rotate(180deg)" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3zm0 0 4-8a2 2 0 0 1 2 2v4h5.3a2 2 0 0 1 2 2.3l-1.2 6.5a2 2 0 0 1-2 1.7H7"/></svg> 아니에요</button></div>`;
  if(r.results.length>1) h+=`<div class="box"><b>다른 후보</b>`+r.results.slice(1).map((c,i)=>`<div class="cand" data-i="${i+1}"><div>${esc(c.name)}<br><small>${esc(c.dept)} · ${esc(c.typeName)} · ${esc(c.period)}</small></div><div><div class="bar"><i style="width:${Math.min(100,c.score*100)}%"></i></div></div></div>`).join('')+`</div>`;
  $('#out').innerHTML=h;
  document.querySelectorAll('#fb button').forEach(b=>b.onclick=()=>{fbpost({kind:'helpful',v:+b.dataset.v});$('#fb').innerHTML='<span>의견 감사합니다. 검색 개선에 활용하겠습니다.</span>'});
  if(r.aiOn&&r.confidence!=='low') ai(r.query);
  else if($('#aisum')) $('#aisum').remove();
  document.querySelectorAll('#out .cand').forEach(e=>e.onclick=()=>{const c=r.results[+e.dataset.i];fbpost({kind:'click',id:c.id});$('#out').insertAdjacentHTML('afterbegin',detail(c));window.scrollTo({top:0,behavior:'smooth'})});
}
const fbpost=b=>LAST&&LAST.lid&&fetch('api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lid:LAST.lid,...b})}).catch(()=>{});
async function ai(q){
  try{const a=await (await fetch('api/ai?q='+encodeURIComponent(q)+(LAST&&LAST.lid?'&lid='+LAST.lid:''))).json(); if(q!==LAST.query)return;
    if(a.summary){$('#aitxt').textContent=a.summary;$('#aitxt').classList.remove('muted')}else $('#aisum')&&$('#aisum').remove();
    if(a.draft&&$('#dr')){$('#dr').textContent=a.draft;const h=document.querySelector('#dr').previousElementSibling;if(h)h.textContent='답변 초안 (AI 작성 · 검토 후 사용)'}
    if(a.error)$('#aitxt')&&($('#aitxt').textContent=a.error)}
  catch(e){$('#aisum')&&$('#aisum').remove()}}
async function go(){const q=$('#q').value.trim();if(!q)return;$('#out').innerHTML='<div class="box muted loading">찾는 중<i></i><i></i><i></i></div>';
  try{{const r=await (await fetch('api/search?cid='+CID+'&q='+encodeURIComponent(q))).json();r.aiOn=AI;render(r)}}catch(e){$('#out').innerHTML='<div class="warn">서버에 연결할 수 없습니다.</div>'}}
function mkcid(){try{const a=new Uint8Array(18);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return Math.random().toString(36).slice(2).padEnd(24,'0')+Date.now().toString(36)}}
const CID=(()=>{try{let c=localStorage.getItem('minwon_cid');if(!/^[A-Za-z0-9_-]{16,64}$/.test(c||'')){c=mkcid();localStorage.setItem('minwon_cid',c)}localStorage.removeItem('minwon_hist');return c}catch(e){return mkcid()}})();
const VIEWS=['chat','list','hist'];
function setView(v){if(!VIEWS.includes(v))v='chat';VIEWS.forEach(k=>$('#v-'+k).hidden=k!==v);
  document.querySelectorAll('#nav a').forEach(a=>a.dataset.v===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(v==='hist')hload();if(v==='chat')fit();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
const fmt=ts=>{const d=new Date(ts*1000),p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};
async function hload(){let rows=[];try{rows=(await (await fetch('api/history?n=50&cid='+CID)).json()).rows||[]}catch(e){}
  $('#histclr').hidden=!rows.length;
  $('#hlist').innerHTML=rows.length?rows.map(r=>`<div class="hrow"><button class="q" data-q="${esc(r.q)}" title="${esc(r.q)}">${esc(r.q)}</button><small>${fmt(r.ts)}</small><button class="x" data-del="${esc(r.q)}" aria-label="이 기록 삭제">×</button></div>`).join(''):'<p class="muted">아직 검색 이력이 없어요. <a href="#chat">대화로 하기</a>에서 질문해 보세요.</p>'}
const hpost=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cid:CID,...b})}).catch(()=>{});
$('#hlist').addEventListener('click',async e=>{const q=e.target.closest('[data-q]'),d=e.target.closest('[data-del]');
  if(q){$('#q').value=q.dataset.q;fit();location.hash='chat';setView('chat');go()}
  else if(d){await hpost('api/history/delete',{q:d.dataset.del});hload()}});
$('#histclr').onclick=async()=>{await hpost('api/history/clear',{});hload()};
function fit(){const t=$('#q');if(!t.offsetParent)return;t.style.height='auto';const h=Math.min(t.scrollHeight+2,260);t.style.height=h+'px';t.style.overflowY=t.scrollHeight>260?'auto':'hidden'}
$('#q').addEventListener('input',fit);window.addEventListener('resize',fit);
$('#go').onclick=go;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();go()}});
const DEF=['건설업 등록증을 분실했어요','체육시설업 등록신청','노동조합 해산신고 방법','상수도 요금 이의신청'];
function exdraw(pop){const a=[...new Set([...(pop||[]),...DEF])].slice(0,5);
  $('#exs').innerHTML=a.map((t,i)=>`<button class="chip"${i<(pop||[]).length?' title="많이 찾는 민원"':''}>${esc(t)}</button>`).join('')}
$('#exs').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){$('#q').value=b.textContent;fit();go()}});exdraw();
let ALL=[],CATS=[],HOT=[],LTIMER=0,F={cat:'',typ:'',now:false,one:false},SHOW=30,TYPES=[];
const isNow=c=>c.period.replace(/\s/g,'')==='즉시';
function lmatch(c,ws,skip){return ws.every(w=>(c.name+' '+c.dept+' '+c.typeName+' '+c.cat).toLowerCase().includes(w))
  &&(skip==='cat'||!F.cat||c.cat===F.cat)&&(skip==='typ'||!F.typ||c.typeName===F.typ)&&(!F.now||isNow(c))&&(!F.one||c.onestop)}
const words=()=>$('#kw').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
function lrow(c){return `<div class="cand" data-id="${esc(c.id)}" tabindex="0" role="button" aria-expanded="false"><div>${esc(c.name)}${c.onestop?'<span class="mini">원스톱</span>':''}<br><small>${esc(c.cat)} · ${esc(c.typeName)}</small></div><div class="r">${esc(c.period)}</div></div>`}
function lrender(keep){
  const ws=words(); if(!keep)SHOW=30;
  const hit=ALL.filter(c=>lmatch(c,ws));
  const cc={};ALL.filter(c=>lmatch(c,ws,'cat')).forEach(c=>cc[c.cat]=(cc[c.cat]||0)+1);
  const tot=Object.values(cc).reduce((a,b)=>a+b,0);
  $('#fcat').innerHTML=`<button class="tg${F.cat?'':' on'}" data-cat="">전체<small>${tot}</small></button>`+CATS.map(k=>`<button class="tg${F.cat===k?' on':''}" data-cat="${esc(k)}"${cc[k]||F.cat===k?'':' disabled'}>${esc(k)}<small>${cc[k]||0}</small></button>`).join('');
  $('#fsub').innerHTML=`<button class="tg${F.now?' on':''}" data-q="now" aria-pressed="${F.now}">⚡ 즉시 처리</button><button class="tg${F.one?' on':''}" data-q="one" aria-pressed="${F.one}">원스톱 접수</button><span class="lb" style="margin-left:6px">유형</span>`
    +TYPES.map(t=>`<button class="tg${F.typ===t?' on':''}" data-typ="${esc(t)}">${esc(t)}</button>`).join('');
  const filtering=ws.length||F.cat||F.typ||F.now||F.one;
  $('#cnt').textContent=hit.length?(filtering?`${hit.length}건`:`전체 ${hit.length}건`):'조건에 맞는 민원이 없습니다. 필터를 풀거나 다른 단어로 찾아보세요.';
  const hot=!filtering?HOT.map(id=>ALL.find(c=>String(c.id)===String(id))).filter(Boolean):[];
  $('#hot').hidden=!hot.length;$('#allh').hidden=!hot.length;$('#hotl').innerHTML=hot.map(lrow).join('');
  $('#list').innerHTML=hit.slice(0,SHOW).map(lrow).join('');
  if(OPEN)lplace(OPEN.box,OPEN.id,OPEN.html,false);
  $('#more').hidden=hit.length<=SHOW;$('#more').textContent=`더 보기 (${Math.min(30,hit.length-SHOW)}건)`;
}
let OPEN=null;
function lclose(){document.querySelectorAll('.inl').forEach(x=>x.remove());document.querySelectorAll('.cand[aria-expanded]').forEach(x=>x.setAttribute('aria-expanded','false'));OPEN=null}
function lplace(box,id,html,scroll){const el=document.querySelector(`#${box} .cand[data-id="${CSS.escape(String(id))}"]`);if(!el)return;
  const d=document.createElement('div');d.className='inl';d.innerHTML=html+'<button class="link2" data-close>접기 ▲</button>';
  el.after(d);el.setAttribute('aria-expanded','true');OPEN={box,id,html};
  if(scroll)el.scrollIntoView({behavior:'smooth',block:'start'})}
async function lopen(el){const box=el.closest('#hotl')?'hotl':'list',id=el.dataset.id;
  if(el.getAttribute('aria-expanded')==='true'){lclose();return}
  lclose();el.setAttribute('aria-expanded','true');
  try{const c=await (await fetch('api/item?id='+encodeURIComponent(id))).json();if(c.error){el.setAttribute('aria-expanded','false');return}
    if(el.getAttribute('aria-expanded')!=='true')return;lclose();lplace(box,id,detail(c),true)}catch(e){el.setAttribute('aria-expanded','false')}}
for(const id of ['#list','#hotl'])$(id).addEventListener('click',e=>{if(e.target.closest('[data-close]')){const i=e.target.closest('.inl');const prev=i&&i.previousElementSibling;lclose();if(prev)prev.scrollIntoView({block:'nearest'})}});
for(const id of ['#list','#hotl']){
  $(id).addEventListener('click',e=>{const el=e.target.closest('.cand');if(el)lopen(el)});
  $(id).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('.cand');if(el){e.preventDefault();lopen(el)}}})}
$('#fcat').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b&&!b.disabled){F.cat=b.dataset.cat;lrender()}});
$('#fsub').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.q==='now')F.now=!F.now;else if(b.dataset.q==='one')F.one=!F.one;else if(b.dataset.typ!==undefined)F.typ=F.typ===b.dataset.typ?'':b.dataset.typ;lrender()});
$('#kw').addEventListener('input',()=>{clearTimeout(LTIMER);LTIMER=setTimeout(lrender,120)});
$('#more').onclick=()=>{SHOW+=30;lrender(true)};
fetch('api/browse?slim=1').then(r=>r.json()).then(r=>{ALL=r.results;CATS=r.cats;HOT=r.hot||[];
  const tc={};ALL.forEach(c=>tc[c.typeName]=(tc[c.typeName]||0)+1);TYPES=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);lrender()
}).catch(()=>{$('#cnt').textContent='목록을 불러오지 못했습니다.'});
fetch('api/meta').then(r=>r.json()).then(m=>{AI=m.ai;exdraw(m.popular);
  $('#src').textContent=`민원 ${m.count}건 · 출처: ${m.meta.source} · 데이터 생성 ${m.meta.built}. 법령 개정 시 관련 법령이 우선합니다.`});
setView(location.hash.slice(1));
</script>
</body>
</html>
